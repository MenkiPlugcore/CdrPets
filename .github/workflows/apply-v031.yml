name: Apply CdrPets v0.3.1

on:
  push:
    branches: ['build/v0.3.1']
    paths: ['.github/workflows/apply-v031.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Reconstruct v0.3.1 source
        shell: bash
        run: |
          set -euo pipefail
          cat .payload/v031.part* > /tmp/cdrpets-v031.b64
          base64 -d /tmp/cdrpets-v031.b64 > /tmp/cdrpets-v031.tar.gz
          mkdir -p /tmp/cdrpets-v031
          tar -xzf /tmp/cdrpets-v031.tar.gz -C /tmp/cdrpets-v031
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.payload' \
            --exclude='.github/workflows/apply-v031.yml' \
            /tmp/cdrpets-v031/ ./
          test "$(grep -o '<version>0.3.1</version>' pom.xml | head -1)" = '<version>0.3.1</version>'

      - name: Verify Paper build
        run: mvn -B -ntp verify

      - name: Commit verified source to staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MenkiPlugcore'
          git config user.email 'cfirmansyah327@gmail.com'
          git add -A -- ':!.payload' ':!.github/workflows/apply-v031.yml'
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'feat: CdrPets v0.3.1 combat PETOPIA capture'
            git push origin HEAD:build/v0.3.1
          fi

      - name: Upload verified plugin
        uses: actions/upload-artifact@v4
        with:
          name: CdrPets-v0.3.1
          path: target/CdrPets-*.jar
          if-no-files-found: error

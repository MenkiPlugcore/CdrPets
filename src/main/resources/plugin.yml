name: CdrPets
version: '0.3.1'
main: id.cadera.cdrpets.CdrPetsPlugin
api-version: '1.21'
author: CADERA
description: Standalone MENKIESTES pet system migrated from the original Skript implementation.
website: https://github.com/MenkiPlugcore/CdrPets
commands:
  pet:
    description: Main CdrPets command.
    usage: /pet
    aliases: [pets]
  petadmin:
    description: CdrPets administration and migration tools.
    usage: /petadmin help
  petopia:
    description: PETOPIA wild-pet and capture commands.
    usage: /petopia
permissions:
  cdrpets.use:
    default: true
  cdrpets.admin:
    default: op

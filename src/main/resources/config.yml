# CdrPets v0.3.1
prefix: '&8[&b&lPET&8] &7'

runtime:
  tick-interval: 5
  follow-start-distance: 3.0
  teleport-distance: 12.0
  target-range: 18.0
  allow-open-world-pvp: false
  restore-active-on-join: true
  remove-orphan-pets-on-enable: true
  remove-orphan-pets-on-chunk-load: true

progression:
  level-cap: 50
  xp-per-level-multiplier: 100
  health-per-level: 0.8
  damage-per-level: 0.08
  energy-max: 100
  evolution-stage-1-level: 10
  evolution-stage-2-level: 30
  evolution-stage-1-health-multiplier: 1.10
  evolution-stage-1-damage-multiplier: 1.08
  evolution-stage-2-health-multiplier: 1.25
  evolution-stage-2-damage-multiplier: 1.18

migration:
  default-skript-variables-path: 'plugins/Skript/variables.csv'
  keep-unmapped-legacy-keys: true

combat:
  disabled-worlds: []
  energy-regen-interval-ticks: 40
  energy-regen-amount: 5
  skill-target-range: 12.0
  max-direct-skill-damage-hearts: 40.0
  dot-damage-cap-hearts-per-second: 10.0

petopia:
  disabled-worlds: []
  global-limit: 40
  near-player-limit: 2
  spawn-check-interval-ticks: 600
  spawn-chance-percent: 12
  despawn-seconds: 180
  capture-lock-seconds: 30
  min-spawn-distance: 24
  max-spawn-distance: 48
  alpha-chance-per-thousand: 30
  alpha-despawn-seconds: 600
  alpha-hp-multiplier: 1.85
  alpha-level-bonus: 5
  alpha-capture-penalty: 25
  hostile-aggro-radius: 14.0
  hostile-hit-radius: 2.6
  hostile-attack-delay-ms: 1000
